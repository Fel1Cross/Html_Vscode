<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Site em JavaScript</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #121212;
        color: white;
        transition: 0.3s;
    }

    header {
        background: #1f1f1f;
        padding: 15px;
        text-align: center;
    }

    nav button {
        margin: 5px;
        padding: 10px 15px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
    }

    section {
        display: none;
        padding: 20px;
    }

    section.active {
        display: block;
    }

    input, button {
        padding: 10px;
        margin: 5px;
        font-size: 16px;
    }

    .light {
        background: #f4f4f4;
        color: black;
    }
</style>
</head>

<body>

<header>
    <h1>Meu Site em JavaScript</h1>
    <nav>
        <button onclick="mostrar('home')">Home</button>
        <button onclick="mostrar('calculadora')">Calculadora</button>
        <button onclick="mostrar('mensagem')">Mensagem</button>
        <button onclick="trocarTema()">Tema</button>
    </nav>
</header>

<section id="home" class="active">
    <h2>Bem-vindo</h2>
    <p>Esse site funciona só com JavaScript 😎</p>
</section>

<section id="calculadora">
    <h2>Calculadora</h2>
    <input id="n1" type="number" placeholder="Número 1">
    <input id="n2" type="number" placeholder="Número 2"><br>
    <button onclick="calcular('+')">+</button>
    <button onclick="calcular('-')">-</button>
    <button onclick="calcular('*')">*</button>
    <button onclick="calcular('/')">/</button>
    <p id="resultado"></p>
</section>

<section id="mensagem">
    <h2>Mensagem</h2>
    <input id="nome" placeholder="Digite seu nome">
    <button onclick="mensagem()">Enviar</button>
    <p id="saida"></p>
</section>

<script>
    function mostrar(id) {
        document.querySelectorAll("section").forEach(sec => {
            sec.classList.remove("active");
        });
        document.getElementById(id).classList.add("active");
    }

    function calcular(op) {
        let n1 = Number(document.getElementById("n1").value);
        let n2 = Number(document.getElementById("n2").value);
        let r = 0;

        if (op === '+') r = n1 + n2;
        if (op === '-') r = n1 - n2;
        if (op === '*') r = n1 * n2;
        if (op === '/') r = n2 !== 0 ? n1 / n2 : "Erro";

        document.getElementById("resultado").innerText = "Resultado: " + r;
    }

    function mensagem() {
        let nome = document.getElementById("nome").value;
        document.getElementById("saida").innerText =
            nome ? `Olá, ${nome}! 👋` : "Digite um nome";
    }

    function trocarTema() {
        document.body.classList.toggle("light");
    }
</script>

</body>
</html>
