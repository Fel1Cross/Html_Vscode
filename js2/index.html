<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Site</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            text-align: center;
            padding-top: 100px;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Meu primeiro site</h1>
    <p id="texto">Clique no botão</p>

    <button onclick="mudarTexto()">Clique aqui</button>

    <script>
        function mudarTexto() {
            document.getElementById("texto").innerText = "Funcionou! 🎉";
        }
    </script>

</body>
</html>
